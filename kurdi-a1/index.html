<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">
<title>Kurdî A1</title>
<style>
@font-face{font-family:Baloo;font-weight:600;src:url(fonts/baloo-2-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2013-2026,U+201C-201D}
@font-face{font-family:Baloo;font-weight:600;src:url(fonts/baloo-2-latin-ext-600-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:Baloo;font-weight:800;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2013-2026,U+201C-201D}
@font-face{font-family:Baloo;font-weight:800;src:url(fonts/baloo-2-latin-ext-800-normal.woff2) format('woff2');unicode-range:U+0100-024F}
html,body{margin:0;background:#111;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Baloo,sans-serif;background:#F6ECD6;transform-origin:0 0}
#stage svg{position:absolute;left:0;top:0}
#stage text{font-family:Baloo,sans-serif}
.title{position:absolute;left:0;right:0;top:128px;text-align:center;font-weight:800;line-height:1;white-space:nowrap;color:#FFC83D;
  -webkit-text-stroke:16px #1f1b16;paint-order:stroke fill;letter-spacing:2px;text-shadow:0 10px 0 rgba(31,27,22,.25)}
.tag{position:absolute;left:0;right:0;top:262px;text-align:center}
.tag span{display:inline-block;background:#1f1b16;color:#fff;font-weight:600;font-size:34px;padding:2px 26px 0;border-radius:40px;letter-spacing:1px}
.sub{position:absolute;left:38px;right:38px;top:1240px;background:#fff;border:8px solid #1f1b16;border-radius:40px;text-align:center;box-shadow:0 12px 0 rgba(31,27,22,.28)}
.sub .ku{font-weight:800;line-height:1.1;color:#1f1b16;padding:44px 30px 22px;letter-spacing:.3px}
.sub .ku b{color:#E0407B}
.sub.R .ku b{color:#2468D8}
.sub .tr{font-weight:700;line-height:1.15;color:#2f2a24;padding:16px 30px 20px;border-top:5px dashed #1f1b16;border-radius:0 0 32px 32px}
.sub.B .tr{background:#FFE3EE}
.sub.R .tr{background:#E1ECFF}
.sub .who{position:absolute;top:-36px;font-weight:800;font-size:38px;color:#fff;padding:4px 28px 0;border-radius:18px;border:6px solid #1f1b16;letter-spacing:1px}
.sub.B .who{left:34px;background:#F06A9B}
.sub.R .who{right:34px;background:#2F7DE1}
.card{position:absolute;left:0;right:0;top:760px;text-align:center}
.card>div{display:inline-block;background:#FFC83D;border:8px solid #1f1b16;border-radius:26px;padding:26px 60px 16px;box-shadow:0 14px 0 rgba(0,0,0,.35)}
.card .ku{font-weight:800;font-size:92px;line-height:1;color:#1f1b16}
.card .tr{font-weight:600;font-size:40px;color:#5a4a1c}
.end{position:absolute;left:70px;right:70px;top:330px;background:#fff;border:8px solid #1f1b16;border-radius:44px;padding:34px 44px 40px;box-shadow:0 16px 0 rgba(31,27,22,.25)}
.end h2{margin:0;font-size:76px;font-weight:800;color:#1f1b16;text-align:center;line-height:1}
.end h3{margin:0 0 22px;font-size:36px;font-weight:600;color:#7b746a;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;border-top:4px dashed #e6dcc6;padding:13px 6px 7px}
.row .k{font-weight:800;font-size:66px;color:#E0407B;line-height:1.05}
.row:nth-child(odd) .k{color:#2468D8}
.row .t{font-weight:600;font-size:46px;color:#3b352d}
.row .k,.row .t{border-radius:14px;padding:0 10px;margin:0 -10px;transition:none}
.row .say{background:#FFE14D;box-shadow:0 0 0 4px #1f1b16}
.row.on{background:#FFF8DD;border-radius:16px}
.cv-top{position:absolute;left:0;right:0;top:120px;text-align:center}
.cv-top span{display:inline-block;background:#1f1b16;color:#fff;font-weight:800;font-size:44px;padding:6px 40px 0;border-radius:50px;letter-spacing:3px}
.cv-a1{position:absolute;left:0;right:0;top:205px;text-align:center;font-weight:800;font-size:170px;line-height:1;color:#fff;-webkit-text-stroke:22px #1f1b16;paint-order:stroke fill;text-shadow:0 14px 0 rgba(31,27,22,.3);transform:rotate(-3deg);white-space:nowrap}
.cv-a1 b{color:#F06A9B;font-size:230px;vertical-align:-12px}
.cv-title{position:absolute;left:0;right:0;top:470px;text-align:center;transform:rotate(-3deg)}
.cv-title div{display:inline-block;background:#1f1b16;color:#FFC83D;font-weight:800;line-height:1;padding:26px 50px 12px;border-radius:30px;white-space:nowrap;box-shadow:0 12px 0 rgba(31,27,22,.3)}
.cv-chip{position:absolute;background:#fff;border:7px solid #1f1b16;border-radius:26px;padding:10px 26px 4px;text-align:center;white-space:nowrap;box-shadow:0 9px 0 rgba(31,27,22,.25)}
.cv-chip .k{font-weight:800;line-height:1.05}
.cv-chip .t{font-weight:600;font-size:32px;color:#7b746a;line-height:1.1}
/* yatay mod */
html.land #stage{width:1920px;height:1080px}
html.land .title{left:40px;right:auto;top:38px;transform-origin:left center;-webkit-text-stroke:13px #1f1b16}
html.land .tag{left:44px;right:auto;top:138px;text-align:left}
html.land .sub{left:230px;right:230px;top:auto;bottom:22px}
html.land .sub .ku{padding:30px 30px 14px}
html.land .sub .tr{padding:10px 30px 14px}
html.land .card{top:330px}
html.land .end{left:300px;right:300px;top:22px;padding:18px 44px 22px}
html.land .end h2{font-size:58px}
html.land .end h3{font-size:30px;margin:0 0 8px}
html.land .row{padding:5px 6px 1px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
// index.html?ep=<bölüm adı>
if (/[?&]land=1/.test(location.search)) document.documentElement.classList.add('land');
window.EPNAME = new URLSearchParams(location.search).get('ep') || 'ez-bas-im';
for (const f of ['episode.js', 'timing.js']) document.write(`<script src="episodes/${window.EPNAME}/${f}"><\/script>`);
document.write('<script src="engine.js"><\/script>');
</script>
</body>
</html>
